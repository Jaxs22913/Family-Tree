<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Luke–McKinnon Line</title>
<meta name="description" content="Ten generations of the Luke and McKinnon families of south Georgia — father's side to the left, mother's to the right.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column}

/* --- stage --- */
#stage{flex:1;position:relative;overflow:hidden;cursor:grab;
  touch-action:none;overscroll-behavior:none;
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--verdigris) 7%, transparent), transparent 62%),
    var(--ground)}
#stage.drag{cursor:grabbing}
#canvas{position:absolute;top:0;left:0;transform-origin:0 0;
  will-change:transform;backface-visibility:hidden}
#wires{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}

/* --- side banners --- */
.sideLabel{position:absolute;font-family:Spectral,serif;font-style:italic;
  font-size:19px;letter-spacing:.01em;color:var(--ink-3);opacity:.8;
  text-align:center;white-space:nowrap;pointer-events:none}

/* --- person node --- */
.node{position:absolute;display:flex;gap:9px;align-items:center;
  width:184px;padding:8px 10px;border-radius:3px;cursor:pointer;
  background:var(--raised);border:1px solid var(--rule);border-left-width:3px;
  box-shadow:0 1px 2px rgba(22,25,26,.05);font:inherit;text-align:left;color:inherit;
  transition:box-shadow .14s ease,border-color .14s ease}
.node:hover{box-shadow:0 2px 4px rgba(22,25,26,.09),0 10px 22px -14px rgba(22,25,26,.35);
  border-color:var(--ink-3);z-index:5}
.node:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px}
.node.c{border-left-color:var(--verdigris)}
.node.pr{border-left-color:var(--ochre)}
.node.l{border-left-color:var(--rust)}
.node.u{border-left-color:var(--ink-3)}
.node.me{width:206px;padding:11px 12px;border-width:1.5px;border-left-width:4px;
  background:var(--verdigris-wash);border-color:var(--verdigris)}

.av{width:36px;height:36px;border-radius:50%;flex:none;overflow:hidden;position:relative;
  background:var(--panel);border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center}
.node.me .av{width:42px;height:42px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av .mono{font-family:Spectral,serif;font-size:13px;font-weight:600;color:var(--ink-3);
  letter-spacing:.01em;user-select:none}
.node.me .av .mono{font-size:15px}
.av.has{border-color:var(--verdigris)}

.nm{min-width:0;flex:1;overflow:hidden}
.nm b{display:block;font-family:Spectral,serif;font-size:13.5px;font-weight:600;
  line-height:1.2;letter-spacing:-.005em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node.me .nm b{font-size:15px}
.nm .yr{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-2);
  margin-top:2px;font-variant-numeric:tabular-nums;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .pl{display:block;font-size:10px;color:var(--ink-3);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .tr{display:block;font-family:Spectral,serif;font-style:italic;font-size:11px;
  margin-top:2px;line-height:1.25;color:var(--verdigris);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm .tr.pr{color:var(--ochre)}
.nm .tr.l{color:var(--rust)}

/* --- controls --- */
#hud{position:absolute;left:14px;bottom:14px;display:flex;gap:6px;align-items:center;z-index:12}
.btn{background:var(--panel);border:1px solid var(--rule);border-radius:3px;
  color:var(--ink-2);font:inherit;font-size:12px;font-weight:500;
  padding:6px 11px;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--raised);color:var(--ink);border-color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px}
.btn.sq{width:30px;padding:6px 0;text-align:center;font-size:14px}

#key{position:absolute;right:14px;bottom:14px;z-index:12;display:flex;flex-direction:column;
  gap:5px;align-items:flex-end;background:color-mix(in srgb,var(--ground) 86%,transparent);
  padding:9px 11px;border:1px solid var(--rule-soft);border-radius:3px;backdrop-filter:blur(4px)}
#key .kr{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-2)}
#key .sw{width:14px;height:3px;border-radius:2px;flex:none}
#key .hint{font-size:10px;color:var(--ink-3);font-style:italic;margin-top:2px}

#hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:12;
  font-size:11.5px;color:var(--ink-3);background:color-mix(in srgb,var(--ground) 86%,transparent);
  padding:5px 12px;border-radius:99px;border:1px solid var(--rule-soft);
  backdrop-filter:blur(4px);pointer-events:none;transition:opacity .5s ease}

@media(max-width:700px){
  #key{display:none}
  #hint{font-size:10.5px}
}
</style>
</head>
<body>

<div id="stage">
  <div id="canvas"><svg id="wires"></svg></div>

  <div id="hint">Drag or two-finger swipe to move · pinch or scroll to zoom · click anyone to open their records</div>

  <div id="hud">
    <button class="btn" id="bFit">Fit</button>
    <button class="btn sq" id="bIn" aria-label="Zoom in">+</button>
    <button class="btn sq" id="bOut" aria-label="Zoom out">−</button>
    <button class="btn" id="bMe">Find me</button>
  </div>

  <div id="key">
    <div class="kr"><span class="sw" style="background:var(--verdigris)"></span>Confirmed by a document</div>
    <div class="kr"><span class="sw" style="background:var(--ochre)"></span>Probable</div>
    <div class="kr"><span class="sw" style="background:var(--rust)"></span>Lead only — unproven</div>
    <div class="kr"><span class="sw" style="background:var(--ink-3)"></span>Living — records withheld</div>
    <div class="hint">Dashed line = the relationship itself is unproven</div>
    <div class="hint">Italic line = trade, where a record states one</div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
/* ---------- who descends from whom ---------- */
const PARENTS = {
  jaxon:['richard','andrea'],
  richard:['elmer','sally'],            andrea:['andrew','lucille'],
  elmer:['jack','nealie'],              sally:['jessehall','mattiecribb'],
  andrew:['monroe','maryjane'],         lucille:['joegiddens','sallymercer'],
  jack:['lucius','narcisus'],           nealie:['mackie','abby'],
  monroe:['george','martha'],           maryjane:['elias','laura'],
  lucius:['rb','janeyawn'],             narcisus:['henrysharper','pollyvickers'],
  george:['jimmckinnon','marydurham'],  martha:['rickerson','marthaoverstreet'],
  rb:['johnluke','telitha'],            janeyawn:['antneyyawn','yawnmother'],
  henrysharper:['hscharper','nancymerritt'],
  jimmckinnon:['jamesmalcolm',null],    rickerson:['josephricketson','serenafoy'],
  johnluke:['danielluke',null],         telitha:['josephgraves',null],
  hscharper:['leonardharper',null],     josephgraves:['benjamingraves',null],
  josephricketson:['timothysr',null]
};

/* grade of the LINK from a person up to their parents — separate from the person's own grade */
const LINK = {
  jaxon:'c', richard:'c', andrea:'c', elmer:'c', sally:'c', andrew:'c', lucille:'c',
  jack:'c',            // 1900 + 1910 census
  nealie:'c',          // 1910 Levy County FL
  monroe:'c', maryjane:'pr',
  lucius:'c',          // 1920 death certificate
  narcisus:'c',        // 1932 county history + 1870 census
  george:'pr', martha:'c',
  rb:'c',              // 1860 + 1870 census
  janeyawn:'pr',       // household co-residence, 1860
  henrysharper:'c',
  jimmckinnon:'pr', rickerson:'l',
  johnluke:'l', telitha:'l', hscharper:'pr', josephgraves:'l', josephricketson:'l'
};

/* ---------- tidy layout ----------
   Leaves are placed in unit slots and parents sit at the mean of their
   children, so no vertical space is wasted between branches. The pixel
   height of a slot is worked out afterwards, from the window's own shape,
   so that the finished bowtie fills the screen instead of sitting in a
   band across the middle of it. */
const COL = 214, CARD_W = 184, CARD_H = 62, ME_W = 206;
const pos = {};
let slots = 0;

function buildSide(rootId, dir){
  let cursor = 0;
  (function place(id, depth){
    const kin = (PARENTS[id] || []).filter(Boolean).filter(k => PEOPLE[k]);
    let u;
    if(!kin.length){ u = cursor; cursor += 1; }
    else {
      const us = kin.map(k => place(k, depth + 1));
      u = us.reduce((a,b) => a + b, 0) / us.length;
    }
    pos[id] = { x: dir * (depth + 1) * COL, u, dir };
    return u;
  })(rootId, 0);
  const off = pos[rootId].u;
  Object.values(pos).forEach(p => { if(p.dir === dir && p.adj !== 1){ p.u -= off; p.adj = 1; } });
  slots = Math.max(slots, cursor);
}
buildSide('richard', -1);
buildSide('andrea',  +1);
pos.jaxon = { x: 0, u: 0, dir: 0 };

/* width is fixed by the number of generations; choose the slot height so the
   drawing has roughly the window's aspect ratio, then clamp it to something
   that always leaves the cards room to breathe. */
const treeW = (Math.max(...Object.values(pos).map(p => Math.abs(p.x))) * 2) + CARD_W + 120;
const uSpan = Math.max(1,
  Math.max(...Object.values(pos).map(p => p.u)) - Math.min(...Object.values(pos).map(p => p.u)));
const vp = document.getElementById('stage').getBoundingClientRect();
const ROW = Math.max(CARD_H + 14,
            Math.min(190, (treeW * (vp.height / Math.max(vp.width, 1))) / uSpan));
Object.values(pos).forEach(p => { p.y = p.u * ROW; });

/* ---------- render ---------- */
const canvas = document.getElementById('canvas');
const wires  = document.getElementById('wires');
const initials = n => n.replace(/["“”]/g,'').split(/\s+/)
  .filter(w => /^[A-Z]/.test(w) && !/^(Sr\.|Jr\.|de|van)$/i.test(w))
  .slice(0,2).map(w => w[0]).join('');

let minX=0, maxX=0, minY=0, maxY=0;
const frag = document.createDocumentFragment();

Object.keys(pos).forEach(id => {
  const p = PEOPLE[id]; if(!p) return;
  const { x, y } = pos[id];
  const me = id === 'jaxon';
  const w = me ? ME_W : CARD_W;

  const el = document.createElement('button');
  el.className = 'node ' + p.g + (me ? ' me' : '');
  el.dataset.id = id;
  el.style.left = (x - w/2) + 'px';
  el.style.top  = (y - CARD_H/2) + 'px';

  const dates = p.liv ? 'living'
    : (p.b || p.d) ? `${(p.b||'?').replace(/^about /,'c.')} – ${(p.d||'?').replace(/^about /,'c.')}`
    : '';
  const place = p.bur ? p.bur.split(',')[0]
    : (p.bp ? p.bp.replace(/<[^>]+>/g,'') : '');
  const trade = p.occ ? p.occ[0] : '';

  el.innerHTML =
    `<span class="av" data-mono="${initials(p.n)}"><span class="mono">${initials(p.n)}</span></span>` +
    `<span class="nm"><b>${p.n.replace(/<[^>]+>/g,'')}</b>` +
    (dates ? `<span class="yr">${dates}</span>` : '') +
    (trade ? `<span class="tr ${p.occ[1]}">${trade}</span>`
           : (place ? `<span class="pl">${place}</span>` : '')) + `</span>`;

  /* photo slot: drop docs/people/<id>.jpg and it appears, no code change */
  const av = el.querySelector('.av');
  const img = new Image();
  img.onload = () => { av.innerHTML = ''; av.appendChild(img); av.classList.add('has'); };
  img.onerror = () => {};
  img.alt = p.n.replace(/<[^>]+>/g,'');
  img.src = 'docs/people/' + id + '.jpg';

  frag.appendChild(el);
  minX = Math.min(minX, x - w/2); maxX = Math.max(maxX, x + w/2);
  minY = Math.min(minY, y - CARD_H/2); maxY = Math.max(maxY, y + CARD_H/2);
});
canvas.appendChild(frag);

/* connector lines */
const NS = 'http://www.w3.org/2000/svg';
const GC = { c:'var(--verdigris)', pr:'var(--ochre)', l:'var(--rust)', u:'var(--ink-3)' };
Object.keys(pos).forEach(id => {
  const kin = (PARENTS[id] || []).filter(Boolean).filter(k => pos[k]);
  if(!kin.length) return;
  const a = pos[id], grade = LINK[id] || 'u';
  const dir = a.dir || (pos[kin[0]].x < 0 ? -1 : 1);
  const edge = a.x + dir * ((id === 'jaxon' ? ME_W : CARD_W)/2);
  const mid  = a.x + dir * (COL * 0.52);
  kin.forEach(k => {
    const b = pos[k];
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d',
      `M ${edge} ${a.y} H ${mid} V ${b.y} H ${b.x - dir * (CARD_W/2)}`);
    path.setAttribute('fill','none');
    path.setAttribute('stroke', GC[grade]);
    path.setAttribute('stroke-width', grade === 'c' ? 1.4 : 1.2);
    path.setAttribute('stroke-linecap','round');
    path.setAttribute('opacity', grade === 'c' ? .75 : .85);
    if(grade !== 'c') path.setAttribute('stroke-dasharray','4 3');
    wires.appendChild(path);
  });
});

/* side banners */
[['Father’s side — the Lukes of Irwin and Coffee', -1],
 ['Mother’s side — the McKinnons of Pearson and Mora', +1]].forEach(([txt, d]) => {
  const el = document.createElement('div');
  el.className = 'sideLabel';
  el.textContent = txt;
  /* centre each banner over its own wing */
  const lo = d < 0 ? minX : COL * 0.55;
  const hi = d < 0 ? -COL * 0.55 : maxX;
  el.style.top  = (minY - 46) + 'px';
  el.style.left = lo + 'px';
  el.style.width = Math.max(200, hi - lo) + 'px';
  canvas.appendChild(el);
});

const PAD = 70;
const bounds = { x: minX - PAD, y: minY - PAD - 20,
                 w: (maxX - minX) + PAD*2, h: (maxY - minY) + PAD*2 + 20 };
wires.setAttribute('width',  bounds.w);
wires.setAttribute('height', bounds.h);
wires.style.left = bounds.x + 'px';
wires.style.top  = bounds.y + 'px';
wires.setAttribute('viewBox', `${bounds.x} ${bounds.y} ${bounds.w} ${bounds.h}`);

/* ---------- pan + zoom ----------
   One transform write per animation frame, never per input event. Dragging
   tracks the pointer exactly; zooming and the HUD buttons glide toward a
   target, which is what stops a trackpad's burst of wheel events from
   snapping the view around. */
const stage = document.getElementById('stage');
const MIN_S = .12, MAX_S = 2.6;

let scale = 1, tx = 0, ty = 0;          /* what is on screen now */
let gScale = 1, gTx = 0, gTy = 0;       /* where it is heading */
let req = 0, gliding = false;

const clamp = s => Math.min(MAX_S, Math.max(MIN_S, s));

function paint(){
  canvas.style.transform = 'translate3d(' + tx.toFixed(2) + 'px,' +
                           ty.toFixed(2) + 'px,0) scale(' + scale.toFixed(4) + ')';
}
function schedule(){ if(!req) req = requestAnimationFrame(tick); }

function tick(){
  req = 0;
  if(gliding){
    const k = .26;
    const ds = gScale - scale, dx = gTx - tx, dy = gTy - ty;
    if(Math.abs(ds) < .0004 && Math.abs(dx) < .3 && Math.abs(dy) < .3){
      scale = gScale; tx = gTx; ty = gTy; gliding = false;
    } else {
      scale += ds * k; tx += dx * k; ty += dy * k;
      schedule();
    }
  }
  paint();
}

/* go straight there — used while dragging, where any easing reads as lag */
function setNow(x, y){
  gScale = scale;
  tx = gTx = x; ty = gTy = y;
  gliding = false; schedule();
}
/* glide there — used for zooming, Fit and Find me */
function glideTo(s, x, y){
  gScale = s; gTx = x; gTy = y;
  gliding = true; schedule();
}

function fit(glide){
  const r = stage.getBoundingClientRect();
  const s = clamp(Math.min(r.width / bounds.w, r.height / bounds.h, 1.1));
  const x = r.width/2  - (bounds.x + bounds.w/2) * s;
  const y = r.height/2 - (bounds.y + bounds.h/2) * s;
  if(glide) glideTo(s, x, y);
  else { scale = gScale = s; tx = gTx = x; ty = gTy = y; gliding = false; schedule(); }
}
function centreOn(id, z){
  const r = stage.getBoundingClientRect(), p = pos[id];
  const s = clamp(z || Math.max(scale, .85));
  glideTo(s, r.width/2 - p.x * s, r.height/2 - p.y * s);
}
/* hold the point under the cursor still while the scale changes */
function zoomAt(f, cx, cy){
  const s = clamp(gScale * f);
  const ratio = s / gScale;
  glideTo(s, cx - (cx - gTx) * ratio, cy - (cy - gTy) * ratio);
}

/* Wheel. A notched mouse wheel zooms a step at a time. A trackpad pans with
   two fingers and zooms on a pinch, which the browser reports as a wheel
   event with ctrlKey set. Zoom is proportional to how far the gesture moved,
   so a nudge nudges and a shove shoves. */
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;

  let dx = e.deltaX, dy = e.deltaY;
  if(e.deltaMode === 1){ dx *= 16; dy *= 16; }               /* Firefox: lines */
  else if(e.deltaMode === 2){ dx *= r.width; dy *= r.height; }

  if(e.ctrlKey || e.metaKey){                                 /* pinch */
    zoomAt(Math.min(1.18, Math.max(.85, Math.exp(-dy * .01))), cx, cy);
    return;
  }
  const notched = dx === 0 && Math.abs(dy) >= 40 && Number.isInteger(dy);
  if(notched) zoomAt(dy < 0 ? 1.18 : 1/1.18, cx, cy);
  else if(e.shiftKey) setNow(tx - dy, ty);
  else setNow(tx - dx, ty - dy);
}, { passive:false });

/* Drag */
let dragging = false, sx = 0, sy = 0, travelled = 0, swallowClick = false;

stage.addEventListener('pointerdown', e => {
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  if(e.target.closest('.node') || e.target.closest('.btn')) return;
  dragging = true; travelled = 0; swallowClick = false;
  gScale = scale; gTx = tx; gTy = ty; gliding = false;   /* adopt what is on screen */
  sx = e.clientX - tx; sy = e.clientY - ty;
  stage.classList.add('drag');
  try { stage.setPointerCapture(e.pointerId); } catch(_){}
});

stage.addEventListener('pointermove', e => {
  if(!dragging) return;
  const nx = e.clientX - sx, ny = e.clientY - sy;
  travelled += Math.abs(nx - tx) + Math.abs(ny - ty);
  setNow(nx, ny);
});

['pointerup','pointercancel'].forEach(t => stage.addEventListener(t, e => {
  if(!dragging) return;
  dragging = false;
  stage.classList.remove('drag');
  if(travelled > 6) swallowClick = true;   /* a real drag must not open a card */
  try { stage.releasePointerCapture(e.pointerId); } catch(_){}
}));

/* a drag that happens to finish over a card would otherwise fire a click on it */
stage.addEventListener('click', e => {
  if(swallowClick){ swallowClick = false; e.stopPropagation(); e.preventDefault(); }
}, true);

document.getElementById('bFit').onclick = () => fit(true);
document.getElementById('bIn').onclick  = () => { const r = stage.getBoundingClientRect(); zoomAt(1.3, r.width/2, r.height/2); };
document.getElementById('bOut').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(1/1.3, r.width/2, r.height/2); };
document.getElementById('bMe').onclick  = () => centreOn('jaxon', 1);

/* keyboard, for anyone who would rather not use a pointer at all */
addEventListener('keydown', e => {
  if(e.target.closest('input,textarea')) return;
  const step = 90;
  if(e.key === '0'){ fit(true); }
  else if(e.key === '+' || e.key === '='){ const r = stage.getBoundingClientRect(); zoomAt(1.3, r.width/2, r.height/2); }
  else if(e.key === '-' || e.key === '_'){ const r = stage.getBoundingClientRect(); zoomAt(1/1.3, r.width/2, r.height/2); }
  else if(e.key === 'ArrowLeft')  glideTo(gScale, gTx + step, gTy);
  else if(e.key === 'ArrowRight') glideTo(gScale, gTx - step, gTy);
  else if(e.key === 'ArrowUp')    glideTo(gScale, gTx, gTy + step);
  else if(e.key === 'ArrowDown')  glideTo(gScale, gTx, gTy - step);
  else return;
  e.preventDefault();
});

let resizeT = 0;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => fit(true), 120); });
fit(false);
setTimeout(() => { const h = document.getElementById('hint'); if(h) h.style.opacity = 0; }, 6500);
</script>
</body>
</html>
